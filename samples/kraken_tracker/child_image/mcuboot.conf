# Enable CLI-friendly MCUboot serial entry by waiting for an MCUmgr trigger
# for a short window after reset.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=8000
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Keep serial recovery enabled over UART.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
